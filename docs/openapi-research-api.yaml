openapi: 3.1.0
info:
  title: Last30Days Remote Research API
  version: 0.1.0
  description: |
    Thin REST wrapper around the upstream last30days research engine.
    Successful POST /v1/research returns upstream Agent JSON pass-through.
    Base URL: https://last30days-research.zeabur.app
servers:
  - url: https://last30days-research.zeabur.app
    description: Primary Zeabur domain
  - url: https://last30days-api.zeabur.app
    description: Alias Zeabur domain
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Cheap liveness probe
      security: []
      responses:
        "200":
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: last30days-research-api
  /v1/capabilities:
    get:
      operationId: getCapabilities
      summary: List available research sources (upstream --diagnose)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Source availability
          content:
            application/json:
              schema:
                type: object
                properties:
                  available_sources:
                    type: array
                    items:
                      type: string
                  wrapper_version:
                    type: string
                  upstream_commit:
                    type: string
        "401":
          description: Unauthorized
  /v1/research:
    post:
      operationId: researchRecent
      summary: Run last-30-days style research; returns Agent JSON
      description: |
        Maps validated fields to upstream last30days.py with
        --emit=json --json-profile=agent. May take minutes; prefer depth=quick
        unless the user needs deep recall. HTTP 200 body is upstream Agent JSON.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResearchRequest"
            examples:
              quick:
                value:
                  topic: AI coding agents
                  days: 7
                  depth: quick
              default:
                value:
                  topic: Claude Code developer experience
                  days: 30
                  depth: default
      responses:
        "200":
          description: Upstream Agent JSON (schema owned by last30days engine)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  schema_version:
                    type: string
                  query:
                    type: string
                  generated_at:
                    type: string
                  window_days:
                    type: integer
                  source_status:
                    type: object
                    additionalProperties: true
                  freshness_verdicts:
                    type: array
                    items: {}
                  clusters:
                    type: array
                    items: {}
                  results:
                    type: array
                    items: {}
        "401":
          description: Unauthorized
        "422":
          description: Validation error
        "429":
          description: Too many concurrent research runs
        "502":
          description: Engine failed or invalid engine JSON
        "504":
          description: Engine timeout
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API_KEY
      description: RESEARCH_API_KEY (wrapper auth; not LAST30DAYS_API_KEY)
  schemas:
    ResearchRequest:
      type: object
      required:
        - topic
      properties:
        topic:
          type: string
          minLength: 1
          maxLength: 500
          description: Research topic (person, product, company, debate)
        days:
          type: integer
          minimum: 1
          maximum: 365
          default: 30
        depth:
          type: string
          enum: [quick, default, deep]
          default: default
        search:
          type: array
          items:
            type: string
          nullable: true
          description: Optional source allowlist tokens
        subreddits:
          type: array
          items:
            type: string
          nullable: true
        x_handle:
          type: string
          nullable: true
          description: X/Twitter handle without @
        github_user:
          type: string
          nullable: true
        register:
          type: string
          enum: [default, exec, dev, creator, eli5]
          default: default
        verify_freshness:
          type: boolean
          default: false
        hiring_signals:
          type: boolean
          default: false
        competitors_plan:
          type: object
          nullable: true
          additionalProperties:
            type: object
            additionalProperties: true
            description: Per-entity targeting (x_handle, subreddits, github_user, context, …)
